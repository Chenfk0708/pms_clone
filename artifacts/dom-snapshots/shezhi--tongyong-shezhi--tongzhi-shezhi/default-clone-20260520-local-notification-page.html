.donut {
  display: grid;
  place-items: center;
  gap: 14px;
}

.donut-ring {
  width: 160px;
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, #fff 38%, transparent 39%),
    conic-gradient(#2269df 0 50%, #ff7a2e 50% 75%, #f0c56b 75% 100%);
}

.donut ul {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
  width: 100%;
}

.donut li {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #5b6a85;
}

.donut i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.table-search,
.empty-state,
.timeline-cell,
.chip,
.chat-state,
.timeline-date em {
  font-size: 13px;
}

.table-search {
  width: 300px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  background: #f7f9fc;
}

.empty-state {
  display: grid;
  place-items: center;
  min-height: 150px;
  color: #adb8ca;
}

.memo-input {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
}

.memo-input input,
.toolbar-card input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
}

.toolbar-card {
  display: grid;
  gap: 12px;
}

.notice-bar {
  flex: 1;
  padding: 10px 12px;
  border: 1px solid #86a6ff;
  border-radius: 8px;
  background: #f5f8ff;
  color: #5872b3;
  font-size: 13px;
}

.toolbar-filters {
  flex-wrap: wrap;
}

.chip {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #f8faff;
  color: #53627c;
}

.chip.is-active {
  border-color: var(--blue);
  color: var(--blue);
  background: var(--blue-soft);
}

.timeline-board {
  overflow: hidden;
}

.timeline-head,
.timeline-row {
  display: grid;
  grid-template-columns: 180px repeat(8, minmax(88px, 1fr));
}

.timeline-room-label,
.timeline-date,
.timeline-room,
.timeline-cell {
  padding: 10px 10px 12px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  min-height: 74px;
}

.timeline-room-label,
.timeline-room {
  background: #fbfcfe;
}

.timeline-date strong,
.timeline-room strong,
.timeline-cell strong {
  display: block;
}

.timeline-date.is-highlight {
  color: var(--blue);
  background: #f6f8ff;
}

.timeline-date em {
  display: inline-flex;
  margin-top: 6px;
  color: #7790cb;
  font-style: normal;
}

.timeline-room span {
  color: var(--muted);
}

.timeline-cell {
  display: grid;
  align-content: start;
  gap: 4px;
}

.tone-empty {
  background: #fff;
  color: #50617b;
}

.tone-blocked {
  background: #f2f4f8;
  color: #7c8799;
}

.tone-booking-blue {
  background: linear-gradient(180deg, #2a73ed, #1e62d9);
  color: #fff;
}

.tone-booking-orange {
  background: linear-gradient(180deg, #ff7f31, #f76715);
  color: #fff;
}

.day-status-summary {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 12px;
  align-items: stretch;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-soft);
}

.day-status-summary p {
  margin: 0 0 6px;
  color: var(--muted);
  font-size: 13px;
}

.day-status-summary strong {
  display: block;
}

.day-status-summary__stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.day-status-summary__stats article {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #f8faff;
}

.day-status-summary__stats span,
.day-status-summary__stats em {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-style: normal;
}

.day-status-summary__stats strong {
  margin: 4px 0;
  color: var(--ink);
  font-size: 22px;
}

.day-board__head,
.day-board__row {
  grid-template-columns: 220px repeat(5, minmax(120px, 1fr));
}

.day-status-page {
  gap: 8px;
}

.day-toolbar {
  padding: 10px 8px;
}

.day-toolbar__search {
  position: relative;
  margin-left: auto;
  width: min(660px, 58vw);
}

.day-toolbar__search input {
  max-width: 400px;
  height: 30px;
  padding: 6px 32px 6px 12px;
  background: #f4f6fb;
  border-color: transparent;
}

.primary-action {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  font-weight: 700;
}

.icon-chip {
  width: 34px;
  height: 30px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: #fff;
  color: #64748b;
}

.day-status-layout {
  display: grid;
  grid-template-columns: 1fr 254px;
  gap: 16px;
  min-height: 720px;
  background: #fff;
}

.day-room-area {
  padding: 8px 0 24px;
}

.day-room-group {
  display: grid;
  justify-items: start;
  margin-bottom: 12px;
}

.day-room-group h3 {
  margin: 0 0 6px;
  color: #1e293b;
  font-size: 14px;
  font-weight: 500;
}

.day-room-empty,
.day-booking-card {
  width: 120px;
  min-height: 120px;
  padding: 10px;
  border-radius: 7px;
}

.day-room-empty {
  border: 1px solid #eef2f7;
  color: #1f2a44;
}

.day-room-empty strong,
.day-booking-card strong,
.day-booking-card b,
.day-booking-card em,
.day-booking-card small {
  display: block;
}

.day-room-empty span,
.day-booking-card span {
  display: block;
  margin-top: 6px;
  overflow: hidden;
  color: inherit;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.day-booking-card {
  color: #fff;
  box-shadow: inset 0 -1px 0 rgb(0 0 0 / 8%);
}

.day-booking-card.is-blue {
  background: linear-gradient(180deg, #4b83eb, #3475e7);
}

.day-booking-card.is-orange {
  background: linear-gradient(180deg, #ffa52c, #ff9822);
}

.day-booking-card b {
  margin-top: 14px;
  font-size: 12px;
}

.day-booking-card em,
.day-booking-card small {
  margin-top: 2px;
  font-size: 12px;
  font-style: normal;
  font-weight: 700;
}

.day-filter-panel {
  display: grid;
  align-content: start;
  gap: 18px;
  padding: 0 10px 18px;
  background: #fff;
}

.day-filter-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding-top: 2px;
}

.day-filter-tabs button {
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: #fff;
  color: #475569;
}

.day-filter-tabs button.is-active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  font-weight: 700;
}

.day-filter-group h3 {
  margin: 0 0 10px;
  color: #1f2937;
  font-size: 14px;
  font-weight: 600;
}

.day-filter-summary {
  margin-top: -8px;
  color: #64748b;
  font-size: 12px;
}

.day-filter-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: -8px;
}

.day-filter-tags span {
  padding: 4px 8px;
  border: 1px solid #c8d6ff;
  border-radius: 999px;
  background: #eef3ff;
  color: var(--blue);
  font-size: 12px;
}

.day-filter-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px 10px;
}

.day-filter-options label {
  display: grid;
  grid-template-columns: 1fr auto 16px;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  padding: 4px 5px;
  border-radius: 4px;
  background: #f2f5fa;
  color: #334155;
  font-size: 12px;
}

.day-filter-options label span::before {
  display: inline-block;
  width: 14px;
  height: 14px;
  margin-right: 4px;
  vertical-align: -2px;
  background: var(--tag-color);
  content: '';
}

.day-filter-options label strong {
  font-size: 12px;
}

.day-filter-options input {
  width: 14px;
  height: 14px;
  padding: 0;
}

.day-filter-group select {
  width: 100%;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: #fff;
  color: #94a3b8;
}

.day-popover-menu {
  position: absolute;
  top: 34px;
  right: 0;
  z-index: 20;
  display: grid;
  width: 150px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 12px 28px rgb(15 23 42 / 14%);
}

.day-popover-menu button {
  justify-content: flex-start;
  border: 0;
  background: transparent;
  color: #1f2a44;
  text-align: left;
}

.day-popover-menu button:hover {
  background: #f4f7ff;
  color: var(--blue);
}

.day-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  background: rgb(15 23 42 / 28%);
}

.day-modal {
  width: min(420px, calc(100vw - 32px));
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 20px 48px rgb(15 23 42 / 22%);
}

.day-modal h2 {
  margin: 0 0 10px;
  font-size: 18px;
}

.day-modal p {
  margin: 6px 0;
  color: #475569;
}

.day-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.timeline-cell span,
.timeline-cell em {
  font-style: normal;
}

.table-card {
  overflow: hidden;
}

.price-grid {
  overflow: auto;
}

.price-grid__head,
.price-grid__row {
  display: grid;
  grid-template-columns: 150px 76px 76px repeat(8, 88px);
  min-width: 1020px;
}

.price-grid__head > div,
.price-grid__row > div,
.price-room-header {
  padding: 12px 10px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

.price-grid__head {
  background: #eef3fb;
  color: #52627d;
}

.price-grid__head strong,
.price-grid__head span {
  display: block;
}

.price-room-header {
  background: #f9fbff;
  font-weight: 700;
}

.price-cell strong,
.price-cell span {
  display: block;
}

.price-cell span {
  color: #7f8ba2;
  font-size: 12px;
}

.price-comparison-page {
  min-height: calc(100vh - 112px);
  padding-right: 0;
}

.price-comparison-empty {
  position: relative;
  display: grid;
  align-items: end;
  min-height: 720px;
  padding: 0 24px 46px;
  border: 0;
  border-radius: 0;
  background-color: #fff;
  background-image:
    url('https://minsubao.localhome.cn/assets/price_compare_bg.png'),
    url('https://locals-house-prod.oss-cn-shenzhen.aliyuncs.com//localhomeqy/COMPARE_UNPAID.png');
  background-position: center bottom, center top;
  background-repeat: no-repeat;
  background-size: min(980px, 78vw) auto, cover;
  overflow: hidden;
}

.price-comparison-empty__art {
  position: relative;
  width: 330px;
  aspect-ratio: 1.2;
}

.price-comparison-empty__art span,
.price-comparison-empty__art i,
.price-comparison-empty__art b {
  position: absolute;
  display: block;
  border-radius: 18px;
}

.price-comparison-empty__art span {
  inset: 38px 38px 62px 24px;
  background: linear-gradient(180deg, #e9efff, #f9fbff);
  border: 1px solid #c9d6ff;
}

.price-comparison-empty__art i {
  left: 82px;
  top: 76px;
  width: 170px;
  height: 86px;
  background: linear-gradient(135deg, #4d65f6, #87a1ff);
}

.price-comparison-empty__art b {
  left: 122px;
  top: 188px;
  width: 126px;
  height: 14px;
  border-radius: 999px;
  background: #dfe6fb;
}

.price-comparison-empty__copy h2 {
  margin: 0;
  color: #1f2a44;
  font-size: 24px;
}

.price-comparison-empty__copy p {
  max-width: 660px;
  margin: 12px 0 20px;
  color: #61708c;
  font-size: 15px;
  line-height: 1.8;
}

.price-comparison-empty__copy button,
.comparison-guide button,
.comparison-modal__panel button {
  border: 1px solid #4d65f6;
  border-radius: 4px;
  background: #4d65f6;
  color: #fff;
  padding: 7px 18px;
}

.comparison-guide {
  position: absolute;
  left: 0;
  right: 0;
  top: 78px;
  z-index: 4;
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 64px;
  padding: 12px 18px;
  background: #fff;
  box-shadow: 0 8px 26px rgba(31, 42, 68, 0.12);
}

.comparison-guide p {
  max-width: 720px;
  margin: 0;
  color: #53627c;
  font-size: 14px;
}

.comparison-guide div {
  display: flex;
  align-items: center;
  gap: 12px;
}

.comparison-guide span {
  color: #6b7890;
  font-size: 13px;
}


.comparison-subscription {
  display: grid;
  gap: 12px;
  min-height: calc(100vh - 112px);
}

.comparison-subscription__hero,
.comparison-subscription__content > section {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
}

.comparison-subscription__hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 108px;
  padding: 20px 24px;
}

.comparison-subscription__hero p,
.comparison-subscription__hero h2,
.comparison-subscription__hero span,
.comparison-subscription__content h3,
.comparison-subscription__detail p,
.comparison-subscription__summary span,
.comparison-subscription__summary em {
  margin: 0;
}

.comparison-subscription__hero p {
  color: #8a97ad;
  font-size: 13px;
}

.comparison-subscription__hero h2 {
  margin: 4px 0 8px;
  color: #202b3d;
  font-size: 24px;
}

.comparison-subscription__hero span {
  display: block;
  max-width: 760px;
  color: #53627c;
  font-size: 14px;
  line-height: 1.8;
}

.comparison-subscription__hero button,
.comparison-buy-button {
  border: 1px solid #4d65f6;
  border-radius: 4px;
  background: #4d65f6;
  color: #fff;
  padding: 8px 18px;
}

.comparison-subscription__content {
  display: grid;
  gap: 12px;
}

.comparison-subscription__content > section {
  padding: 20px 24px;
}

.comparison-subscription__content h3 {
  margin-bottom: 16px;
  color: #202b3d;
  font-size: 18px;
}

.comparison-subscription__detail {
  display: grid;
  min-height: 160px;
  align-content: center;
  gap: 10px;
  padding: 24px;
  border-radius: 8px;
  background: linear-gradient(135deg, #f5f8ff 0%, #eef4ff 100%);
}

.comparison-subscription__detail strong {
  color: #4d65f6;
  font-size: 34px;
}

.comparison-subscription__detail p {
  color: #52627d;
}

.comparison-subscription__summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.comparison-subscription__summary article {
  display: grid;
  gap: 7px;
  padding: 16px;
  border: 1px solid #e2e7f1;
  border-radius: 8px;
  background: #fbfcff;
}

.comparison-subscription__summary span,
.comparison-subscription__summary em {
  color: #7b879d;
  font-style: normal;
  font-size: 13px;
}

.comparison-subscription__summary strong {
  color: #202b3d;
  font-size: 22px;
}

.comparison-purchase-message {
  margin: 12px 0;
  color: #d04747;
  font-size: 13px;
}

.comparison-buy-button {
  margin-top: 14px;
}


.price-comparison-page {
  padding-right: 0;
}

.price-comparison-toolbar input {
  max-width: 260px;
}

.comparison-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.comparison-card {
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel);
}

.comparison-card > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.comparison-card > div span {
  flex: 0 0 auto;
  padding: 3px 10px;
  border-radius: 999px;
  color: #53627c;
  background: #f3f6fb;
  font-size: 12px;
}

.comparison-card strong {
  font-weight: 700;
}

.comparison-card dl {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 0;
}

.comparison-card dt,
.comparison-matrix span {
  color: var(--muted);
  font-size: 12px;
}

.comparison-card dd {
  margin: 4px 0 0;
  font-size: 18px;
  font-weight: 700;
}

.comparison-card--primary {
  border-color: #8fa2ff;
  background: linear-gradient(180deg, #f7f9ff, #fff);
}

.comparison-card--green dd {
  color: #1d9e61;
}

.comparison-card--orange dd {
  color: #e66b1d;
}

.comparison-table {
  overflow: auto;
}

.comparison-table__head {
  display: grid;
  grid-template-columns: 220px repeat(8, 92px);
  min-width: 960px;
  background: #eef3fb;
  color: #52627d;
}

.comparison-table__head > div {
  padding: 12px 10px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.comparison-table__head strong,
.comparison-table__head span {
  display: block;
}

.comparison-room {
  font-weight: 700;
  color: #2f3a51;
}

.comparison-matrix {
  min-width: 960px;
}

.comparison-matrix__row {
  display: grid;
  grid-template-columns: 120px 120px 120px 120px 1fr 120px;
  background: #fff;
}

.comparison-matrix__row > div {
  min-height: 66px;
  padding: 10px 12px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.comparison-matrix strong {
  display: block;
  margin-top: 5px;
  color: #2f3a51;
}

.ota-section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.section-header h2,
.report-section h2 {
  margin: 0;
  font-size: 20px;
}

.ota-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.ota-card {
  display: grid;
  grid-template-columns: 1fr 82px;
  gap: 12px;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #c9daf8;
  background: linear-gradient(180deg, #eff5ff, #edf3fb);
}

.ota-card--pending {
  background: #f6f8fc;
  border-color: var(--border);
}

.ota-card__meta strong,
.ota-card__meta span {
  display: block;
}

.ota-card__meta span {
  margin-top: 6px;
  color: #7d8ba5;
  font-size: 13px;
}

.ota-card__logo {
  display: grid;
  place-items: center;
  width: 82px;
  height: 82px;
  border-radius: 18px;
  background: #fff;
  color: #3152d0;
  font-weight: 700;
}

.ota-card__actions {
  grid-column: 1 / -1;
  display: flex;
  gap: 8px;
}

.report-section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
}

.report-business-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.report-cards {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  margin-top: 10px;
}

.report-chart {
  min-height: 420px;
}

.data-table {
  overflow: auto;
}

.data-table__head,
.data-table__row {
  display: grid;
  grid-template-columns:
    168px 72px 92px 92px 140px 90px 150px 70px 88px 124px 124px 84px 92px 92px 82px
    92px 92px 82px 124px 82px 110px 68px 68px 68px;
  min-width: 2300px;
}

.data-table__head {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #eef3fb;
  color: #51617c;
  font-weight: 600;
}

.data-table__head > div,
.data-table__row > div {
  padding: 14px 10px;
  border-bottom: 1px solid var(--border);
}

.data-table__row {

  justify-content: space-between;
  gap: 16px;
  min-height: 36px;
}

.write-expend-toolbar-copy {
  display: grid;
  gap: 8px;
}

.write-expend-toolbar p {
  margin: 0;
  color: #5f6879;
  font-size: 14px;
}

.write-expend-status {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  color: #3e4a61;
  font-size: 13px;
  line-height: 20px;
}

.write-expend-status em {
  color: #8b94a7;
  font-style: normal;
}

.write-expend-primary {
  min-width: 72px;
  height: 32px;
  border: 1px solid #4157f6;
  border-radius: 4px;
  background: #4157f6;
  color: #fff;
  font-size: 14px;
  line-height: 30px;
}

.write-expend-primary:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

.write-expend-tabs {
  display: flex;
  align-items: flex-end;
  gap: 32px;
  height: 48px;
  margin-top: 8px;
  border-bottom: 1px solid #e5e8ef;
}

.write-expend-tabs button {
  position: relative;
  height: 48px;
  border: 0;
  background: transparent;
  color: #4a5568;
  font-size: 15px;
  padding: 0;
}

.write-expend-tabs button.is-active {
  color: #4058f6;
  font-weight: 500;
}

.write-expend-tabs button.is-active::after {
  content: '';
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 2px;
  border-radius: 2px;
  background: #4058f6;
}

.write-expend-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 14px 0 4px;
}

.write-expend-meta span {
  min-height: 28px;
  padding: 0 12px;
  border-radius: 999px;
  background: #f5f7fb;
  color: #556176;
  font-size: 13px;
  line-height: 28px;
}

.write-expend-alert {
  display: grid;
  gap: 8px;
  align-items: start;
  margin-top: 12px;
  padding: 14px 16px;
  border: 1px solid #ffd9d9;
  border-radius: 8px;
  background: #fff6f6;
}

.write-expend-alert strong {
  color: #b42318;
  font-size: 14px;
}

.write-expend-alert span {
  color: #7a271a;
  font-size: 14px;
}

.write-expend-alert button {
  justify-self: start;
}

.write-expend-loading {
  display: grid;
  gap: 14px;
  padding-top: 18px;
}

.write-expend-loading-row {
  display: grid;
  grid-template-columns: 86px minmax(0, 1fr);
  gap: 12px;
}

.write-expend-loading-label,
.write-expend-loading-pill,
.write-expend-loading-empty {
  display: block;
  border-radius: 6px;
  background: linear-gradient(90deg, #eef2f8 0%, #f7f9fc 50%, #eef2f8 100%);
  background-size: 240px 100%;
  animation: write-expend-loading 1.4s infinite linear;
}

.write-expend-loading-label {
  width: 64px;
  height: 18px;
  margin-top: 10px;
}

.write-expend-loading-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
}

.write-expend-loading-pill {
  width: 176px;
  height: 38px;
}

.write-expend-loading-pill.is-wide {
  width: 240px;
}

.write-expend-loading-empty {
  width: 100%;
  height: 38px;
}

.write-expend-groups {
  padding-top: 16px;
}

.write-expend-group {
  display: grid;
  grid-template-columns: 86px minmax(0, 1fr);
  align-items: start;
  min-height: 48px;
  margin-bottom: 12px;
}

.write-expend-group h2,
.write-expend-disabled h2 {
  margin: 0;
  color: #202634;
  font-size: 14px;
  font-weight: 500;
  line-height: 36px;
}

.write-expend-item-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
  padding: 0 0 4px;
}

.write-expend-item {
  position: relative;
  display: grid;
  grid-template-columns: 22px minmax(82px, 1fr) 18px;
  align-items: center;
  width: 176px;
  min-height: 38px;
  padding: 0 8px;
  border: 1px solid #dfe3ed;
  border-radius: 4px;
  background: #fff;
  color: #1f2937;
  font-size: 14px;
  box-shadow: 0 1px 2px rgb(16 24 40 / 4%);
}

.write-expend-item.is-disabled {
  border-style: dashed;
  background: #fafbff;
}

.write-expend-drag {
  color: #c0c6d4;
  font-size: 15px;
  line-height: 1;
}

.write-expend-item-name {
  overflow: hidden;
  padding-right: 4px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.write-expend-lock {
  width: 14px;
  height: 14px;
  border: 1px solid #c9ced8;
  border-radius: 2px;
  background: linear-gradient(#f4f6fa 0 0) center 6px / 8px 1px no-repeat;
}

.write-expend-lock::before {
  content: '';
  display: block;
  width: 7px;
  height: 5px;
  margin: -5px auto 0;
  border: 1px solid #c9ced8;
  border-bottom: 0;
  border-radius: 6px 6px 0 0;
  background: #fff;
}

.write-expend-default-badge {
  position: absolute;
  top: -1px;
  right: -1px;
  min-width: 32px;
  height: 18px;
  padding: 0 5px;
  border-radius: 0 4px 0 6px;
  background: #edf0ff;
  color: #5265ff;
  font-size: 12px;
  line-height: 18px;
  text-align: center;
}

.write-expend-default-badge.is-custom {
  background: #fff3dd;
  color: #b96b00;
}

.write-expend-empty-box {
  display: flex;
  align-items: center;
  min-height: 38px;
  padding: 0 12px;
  border: 1px dashed #e1e5ef;
  border-radius: 4px;
  background: #fbfcff;
  color: #8b94a7;
  font-size: 14px;
}

.write-expend-empty-box p {
  margin: 0;
}

.write-expend-empty-box button {
  border: 0;
  background: transparent;
  color: #4058f6;
  padding: 0;
  font-size: 14px;
}

.write-expend-divider {
  height: 1px;
  margin: 20px 0 6px;
  background: #e5e8ef;
}

.write-expend-disabled {
  display: grid;
  grid-template-columns: 86px minmax(0, 1fr);
  align-items: start;
  min-height: 42px;
}

.write-expend-disabled-empty {
  min-height: 38px;
  border: 1px dashed #e4e8f0;
  border-radius: 4px;
  background: #fafcff;
  color: #8b94a7;
  font-size: 14px;
  line-height: 38px;
  text-align: center;
}

.write-expend-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  justify-items: center;
  align-items: start;
  padding-top: 100px;
  background: rgb(0 0 0 / 45%);
}

.write-expend-modal {
  width: 520px;
  border-radius: 2px;
  background: #fff;
  box-shadow:
    0 3px 6px -4px rgb(0 0 0 / 12%),
    0 6px 16px 0 rgb(0 0 0 / 8%),
    0 9px 28px 8px rgb(0 0 0 / 5%);
}

.write-expend-modal header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 54px;
  padding: 0 20px;
  border-bottom: 1px solid #edf0f5;
}

.write-expend-modal h2 {
  margin: 0;
  color: #151b28;
  font-size: 16px;
  font-weight: 500;
}

.write-expend-modal header button {
  width: 28px;
  height: 28px;
  border: 0;
  background: transparent;
  color: #8b94a7;
  font-size: 22px;
  line-height: 1;
}

.write-expend-modal form {
  display: grid;
  gap: 12px;
  padding: 20px 24px 16px;
}

.write-expend-form-row {
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  color: #1f2937;
  font-size: 14px;
}

.write-expend-form-row > span {
  justify-self: end;
}

.write-expend-form-row em {
  color: #ff4d4f;
  font-style: normal;
  margin-right: 2px;
}

.write-expend-select,
.write-expend-form-row input {
  width: 100%;
  height: 34px;
  border: 1px solid #d7dce7;
  border-radius: 4px;
  background: #fff;
  color: #1f2937;
  font-size: 14px;
}

.write-expend-select {
  padding: 0 10px;
}

.write-expend-form-row input {
  padding: 0 10px;
}

.write-expend-form-error {
  margin: 0;
  padding-left: 96px;
  color: #d92d20;
  font-size: 13px;
  line-height: 20px;
}

.write-expend-modal footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 4px;
}

.write-expend-modal footer button {
  min-width: 72px;
  height: 32px;
  border: 1px solid #d7dce7;
  border-radius: 4px;
  background: #fff;
  color: #1f2937;
  font-size: 14px;
}

.write-expend-modal footer .write-expend-primary {
  border-color: #4157f6;
  background: #4157f6;
  color: #fff;
}

@keyframes write-expend-loading {
  from {
    background-position: 240px 0;
  }

  to {
    background-position: 0 0;
  }
}

@media (max-width: 1180px) {
  .write-expend-item {
    width: 158px;
  }

  .write-expend-group,
  .write-expend-disabled,
  .write-expend-loading-row {
    grid-template-columns: 72px minmax(0, 1fr);
  }
}

@media (max-width: 860px) {
  .write-expend-toolbar {
    flex-direction: column;
    align-items: stretch;
  }

  .write-expend-meta {
    gap: 8px;
  }

  .write-expend-meta span {
    min-height: 24px;
    line-height: 24px;
  }

  .write-expend-modal {
    width: min(520px, calc(100vw - 24px));
  }
}
